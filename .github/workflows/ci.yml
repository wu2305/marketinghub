name: ci

# Two jobs:
#   verify  light gate, runs on PRs to main and on pushes to main.
#   visual  heavy browser gate (host-check, visual-check, --negative, font probe);
#           runs in full on a v* tag push, and by hand (Actions > ci > Run
#           workflow, pick the branch): a branch is limited to what changed
#           against main, main itself runs in full (it has nothing to diff).
# Branch pushes do not run CI on their own: the PR run covers them.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "handover/**"
      - "docs/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "handover/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build-storybook
      - run: npm run build:host
      - run: npm run build:lib

  visual:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Tags and main check everything (main against origin/main selects nothing
      # and would pass with zero scenarios); other branches only what differs from main.
      AFFECTED: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && '' || '--affected origin/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --affected needs the merge base with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run build:host
      - run: npx playwright install --with-deps chromium
      - run: node scripts/host-check.mjs --out ci-evidence/host
      # The original demo is frozen, so passing original-side results are reused
      # across runs until the demo, the runner or the browser changes.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mh-visual-original
          key: visual-original-${{ hashFiles('index.html', 'assets/**', 'scripts/visual-check.mjs', 'scripts/visual-check/common.mjs', 'package-lock.json') }}
      - run: node scripts/visual-check.mjs $AFFECTED --out ci-evidence/visual
      - run: node scripts/visual-check.mjs $AFFECTED --negative --out ci-evidence/negative
      - name: font probe
        run: |
          (cd storybook-static && python3 -m http.server 6107 >/dev/null 2>&1 &)
          sleep 1
          node scripts/font-probe.mjs http://127.0.0.1:6107 $AFFECTED | tee ci-evidence/font-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence
          path: ci-evidence/
          retention-days: 14
