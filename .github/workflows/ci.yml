name: ci

# Two jobs:
#   verify  light gate, runs on PRs to main and on pushes to main.
#   visual  heavy browser gate (host-check, visual-check, --negative, font probe);
#           runs in full on a v* tag push, and by hand (Actions > ci > Run
#           workflow, pick the branch) limited to what changed against main.
# Branch pushes do not run CI on their own: the PR run covers them.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "handover/**"
      - "docs/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "handover/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # lint + unit tests and the three builds are independent, so they run side by
  # side; `verify` is the single gate (keep this name if branch protection
  # requires it).
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run build:host
      - run: npm run build:lib

  verify:
    # Runs even when a needed job failed (a skipped required check would pass).
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.build.result }}" = success ]

  visual:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --affected needs the merge base with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Tags and manual runs on main check everything (on main --affected origin/main
      # is an empty diff, so it would select zero scenarios and still pass); a
      # manual run on another ref checks only what differs from main.
      # (A `tag && '' || x` expression cannot do this: '' is falsy, so x always won.)
      - name: choose scope
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_REF_NAME" = main ]; then
            echo "AFFECTED=" >> "$GITHUB_ENV"
            echo "scope: full"
          else
            echo "AFFECTED=--affected origin/main" >> "$GITHUB_ENV"
            echo "scope: --affected origin/main"
          fi
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run build:host
      # Browser download is cached by Playwright version; system deps still install.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/host-check.mjs --out ci-evidence/host
      # The original demo is frozen, so passing original-side results are reused
      # across runs until the demo, the runner or the browser changes.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mh-visual-original
          key: visual-original-${{ hashFiles('index.html', 'assets/**', 'scripts/visual-check.mjs', 'scripts/visual-check/common.mjs', 'package-lock.json') }}
      - run: node scripts/visual-check.mjs $AFFECTED --out ci-evidence/visual
      - run: node scripts/visual-check.mjs $AFFECTED --negative --out ci-evidence/negative
      - name: font probe
        run: |
          (cd storybook-static && python3 -m http.server 6107 >/dev/null 2>&1 &)
          sleep 1
          node scripts/font-probe.mjs http://127.0.0.1:6107 $AFFECTED | tee ci-evidence/font-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence
          path: ci-evidence/
          retention-days: 14
