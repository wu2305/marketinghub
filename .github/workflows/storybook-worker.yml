name: Storybook Worker

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

# All triggers update the same Worker; do not interrupt an active upload.
concurrency:
  group: storybook-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository configuration: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build-storybook
      - name: Deploy Storybook
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b00a0a78ddfa0b2e9051f6cc7946bd85
          command: deploy
      - name: Check deployed Storybook
        env:
          DEPLOYMENT_URL: https://marketinghub.gdindex.workers.dev
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 "$DEPLOYMENT_URL/index.json" -o /tmp/deployed-index.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const local = JSON.parse(readFileSync('storybook-static/index.json'));
          const remote = JSON.parse(readFileSync('/tmp/deployed-index.json'));
          assert.deepEqual(remote, local, 'Deployed Storybook index differs from this build');
          NODE
          printf 'Storybook deployment: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
